<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>AquaMind — Dive Into Knowledge</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#061622;
    --abyss-2:#0B2333;
    --panel:#0F2C40;
    --panel-2:#123650;
    --line: rgba(125,211,225,0.18);
    --cyan:#4DE8E0;
    --cyan-dim:#2E8C8A;
    --violet:#8B7CF6;
    --coral:#FF6B6B;
    --gold:#FFC96B;
    --foam:#E7F6F8;
    --foam-dim:#83A9B4;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; padding:0;}
  html{
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #103b52 0%, var(--abyss) 55%, #030c13 100%);
  }
  body{
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #103b52 0%, var(--abyss) 55%, #030c13 100%);
    color: var(--foam);
    font-family:'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
  }
  .font-display{ font-family:'Orbitron', sans-serif; letter-spacing:0.02em; }
  .font-arcade{ font-family:'Press Start 2P', 'Orbitron', sans-serif; line-height:1.7; letter-spacing:0.01em; }
  .neon-cyan{ color:#6CFBF3; text-shadow: 0 0 6px rgba(108,251,243,0.9), 0 0 18px rgba(77,232,224,0.6), 0 0 34px rgba(77,232,224,0.35); }
  .neon-yellow{ color:#FFE68A; text-shadow: 0 0 6px rgba(255,230,138,0.9), 0 0 18px rgba(255,201,107,0.55); }

  /* ---------- Ambient canvas + bubbles ---------- */
  #caustics-canvas{ position:fixed; inset:0; z-index:0; opacity:0.55; pointer-events:none; }
  #bubble-field{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .bubble{
    position:absolute; bottom:-10%;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(200,245,250,0.55), rgba(150,220,230,0.05) 70%);
    border:1px solid rgba(200,245,250,0.15);
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    8%{ opacity:0.8; }
    100%{ transform: translateY(-115vh) translateX(var(--drift, 20px)); opacity:0; }
  }

  #app{ transition: transform .1s; }
  .app-fullscreen{ min-height:100vh; min-height:100dvh; width:100%; }

  /* Battle screen pins directly to the viewport (fixed), completely bypassing
     #app's flex-centering and padding — that combination was compounding two
     different centering calculations and shifting/clipping the scene. */
  .battle-fullscreen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    height:100dvh;
    overflow-y:auto;
    z-index:20;
  }
  .shake-sm{ animation: appShakeSm .3s ease; }
  .shake-md{ animation: appShakeMd .35s ease; }
  .shake-lg{ animation: appShakeLg .45s ease; }
  @keyframes appShakeSm{
    10%,90%{ transform: translate3d(-1px,0,0); }
    30%,50%,70%{ transform: translate3d(-2px,0,0); }
    40%,60%{ transform: translate3d(2px,0,0); }
  }
  @keyframes appShakeMd{
    10%,90%{ transform: translate3d(-1px,0,0); }
    20%,80%{ transform: translate3d(2px,0,0); }
    30%,50%,70%{ transform: translate3d(-5px,0,0); }
    40%,60%{ transform: translate3d(5px,0,0); }
  }
  @keyframes appShakeLg{
    10%,90%{ transform: translate3d(-3px,0,0); }
    20%,80%{ transform: translate3d(5px,0,0); }
    30%,50%,70%{ transform: translate3d(-11px,0,0) rotate(-0.3deg); }
    40%,60%{ transform: translate3d(11px,0,0) rotate(0.3deg); }
  }

  #damage-vignette{
    position:fixed; inset:0; pointer-events:none; z-index:40;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(255,60,60,0.5) 100%);
    opacity:0;
  }

  /* ---------- Panels ---------- */
  .panel{
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2) inset, 0 12px 32px -12px rgba(0,0,0,0.6), 0 0 24px -8px rgba(77,232,224,0.15);
    border-radius: 18px;
  }
  .glow-edge{ box-shadow: 0 0 0 1px rgba(77,232,224,0.35), 0 0 22px -4px rgba(77,232,224,0.45); }
  .question-panel{
    border: 2px solid rgba(77,232,224,0.4);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2) inset, 0 12px 32px -12px rgba(0,0,0,0.6), 0 0 26px -6px rgba(77,232,224,0.4);
  }

  .field-input{
    background: rgba(4,18,28,0.65);
    border:1px solid var(--line);
    color: var(--foam);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    width:100%;
    transition: border-color .2s, box-shadow .2s;
  }
  .field-input:focus{ outline:none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(77,232,224,0.2); }
  .field-input::placeholder{ color: var(--foam-dim); }

  select.field-input{ appearance:none; -webkit-appearance:none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 20 20' fill='none'><path d='M5 7.5L10 12.5L15 7.5' stroke='%2383A9B4' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>"); background-repeat:no-repeat; background-position: right 0.9rem center; padding-right:2.4rem; }

  .label-tag{ color: var(--foam-dim); font-size:0.78rem; font-weight:600; margin-bottom:0.4rem; display:block; }

  .btn-primary{
    background: linear-gradient(180deg, var(--cyan) 0%, var(--cyan-dim) 100%);
    color: #04141c;
    font-family:'Press Start 2P', 'Orbitron', sans-serif;
    font-size:0.8rem;
    border-radius: 14px;
    padding: 1.05rem 1.5rem;
    box-shadow: 0 8px 24px -8px rgba(77,232,224,0.55), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform .15s ease, box-shadow .15s ease;
    touch-action: manipulation;
  }
  .btn-primary:active{ transform: scale(0.97); box-shadow: 0 4px 14px -6px rgba(77,232,224,0.5); }
  .btn-primary:disabled{ opacity:0.4; filter:grayscale(0.4); }

  .btn-ghost{
    background: linear-gradient(180deg, #16394E, #0B2333);
    border:1px solid var(--line);
    color: var(--foam);
    font-family:'Press Start 2P', 'Orbitron', sans-serif;
    font-size:0.68rem;
    border-radius: 14px;
    padding: 0.95rem 1rem;
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
    touch-action: manipulation;
  }
  .btn-ghost:active{ transform: scale(0.97); background: rgba(77,232,224,0.14); }

  .choice-btn{
    background: linear-gradient(180deg, #16354A 0%, #0A1E2B 100%);
    border:2px solid rgba(77,232,224,0.35);
    border-radius:12px;
    padding: 0.6rem 0.85rem;
    font-size:0.9rem;
    text-align:left;
    color: var(--foam);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 4px 12px -6px rgba(0,0,0,0.7), 0 0 10px -3px rgba(77,232,224,0.35);
    transition: border-color .15s, box-shadow .15s, transform .12s;
    touch-action: manipulation;
    width:100%;
  }
  .choice-btn:active{ transform: scale(0.98); }
  @media (hover:hover) and (pointer:fine){
    .choice-btn:not(:disabled):hover{
      border-color: #FFE68A;
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 8px 18px -6px rgba(0,0,0,0.75), 0 0 16px -2px rgba(255,201,107,0.55);
    }
  }
  .choice-btn.is-correct{ border-color: #3FE0A0; background: linear-gradient(180deg,#123B2C,#0A2419); box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 0 16px -2px rgba(63,224,160,0.6); }
  .choice-btn.is-wrong{ border-color: var(--coral); background: linear-gradient(180deg,#3B1616,#240A0A); box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 0 16px -2px rgba(255,107,107,0.6); }
  .choice-btn:disabled{ opacity:0.55; }

  /* ---------- HUD / HP bars ---------- */
  .hud-frame{
    padding: 3px;
    border-radius: 14px;
    background: linear-gradient(135deg, #C9971C 0%, #F5D67B 30%, #8B5A2B 65%, #C9971C 100%);
    box-shadow: 0 6px 14px -6px rgba(0,0,0,0.6);
  }
  .hud-frame .panel{ border-radius: 11px; }
  .hp-track{ background: rgba(4,15,22,0.7); border:1px solid var(--line); border-radius:999px; height:16px; overflow:hidden; position:relative; }
  .hp-fill{ height:100%; border-radius:999px; transition: width 0.5s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden; }
  .hp-fill::after{
    content:''; position:absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    width:40%; animation: hpShimmer 2.2s linear infinite;
  }
  @keyframes hpShimmer{ 0%{ transform: translateX(-120%); } 100%{ transform: translateX(320%); } }
  .hp-fill-player{ background: linear-gradient(90deg, #16C46A, #6CFFA6); box-shadow: 0 0 10px #22ff88, inset 0 0 6px rgba(255,255,255,0.45); }
  .hp-fill-monster{ background: linear-gradient(90deg, #E43B3B, #FF8F8F); box-shadow: 0 0 10px #ff4040, inset 0 0 6px rgba(255,255,255,0.45); }
  .hp-fill.low-hp{ animation: lowHpPulse 0.9s ease-in-out infinite; }
  @keyframes lowHpPulse{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.65) saturate(1.3); } }

  /* ---------- Character cards ---------- */
  .creature-card{ transition: transform .12s; position:relative; }
  .animate-float{ animation: floaty 4.6s ease-in-out infinite; }
  @keyframes floaty{
    0%,100%{ transform: translate(0,0) rotate(-1deg); }
    25%{ transform: translate(9px,-10px) rotate(0.5deg); }
    50%{ transform: translate(-5px,-16px) rotate(1.2deg); }
    75%{ transform: translate(-11px,-6px) rotate(-0.6deg); }
  }
  .animate-hit{ animation: hitshake 0.42s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes hitshake{
    10%,90%{ transform: translate3d(-2px,0,0) rotate(-1deg); }
    20%,80%{ transform: translate3d(4px,0,0) rotate(1deg); }
    30%,50%,70%{ transform: translate3d(-8px,0,0) rotate(-2deg); }
    40%,60%{ transform: translate3d(8px,0,0) rotate(2deg); }
  }
  .flash-red{ animation: flashred 0.42s ease; }
  @keyframes flashred{ 0%{ filter: brightness(1) saturate(1);} 30%{ filter: brightness(1.6) saturate(2) hue-rotate(-20deg);} 100%{ filter: brightness(1) saturate(1);} }

  /* monster takes a hit: bigger recoil + squash, more predator-like than the diver's shake */
  .recoil-hit{ animation: recoilKick 0.5s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes recoilKick{
    0%{ transform: translateX(0) scale(1,1); }
    20%{ transform: translateX(22px) scale(0.9,1.1); }
    45%{ transform: translateX(-12px) scale(1.05,0.95); }
    70%{ transform: translateX(6px) scale(0.98,1.02); }
    100%{ transform: translateX(0) scale(1,1); }
  }
  /* monster lunges at the player before landing a hit */
  .lunge{ animation: lungeForward 0.4s ease-in-out both; }
  @keyframes lungeForward{
    0%{ transform: translateX(0) scale(1); }
    55%{ transform: translateX(-30px) scale(1.06); }
    100%{ transform: translateX(0) scale(1); }
  }
  /* characters swim into the arena at battle start */
  .swim-in-left{ animation: swimInLeft .6s cubic-bezier(.2,.85,.25,1.15) both; }
  .swim-in-right{ animation: swimInRight .6s cubic-bezier(.2,.85,.25,1.15) both; }
  @keyframes swimInLeft{ 0%{ transform: translateX(-130px) scale(0.7); opacity:0; } 100%{ transform: translateX(0) scale(1); opacity:1; } }
  @keyframes swimInRight{ 0%{ transform: translateX(130px) scale(0.7); opacity:0; } 100%{ transform: translateX(0) scale(1); opacity:1; } }

  /* harpoon dart fired between characters */
  .harpoon-dart{
    position:fixed; height:4px; border-radius:3px; z-index:30; pointer-events:none;
    background: linear-gradient(90deg, var(--gold), rgba(255,201,107,0));
    box-shadow: 0 0 10px rgba(255,201,107,0.85);
    transform-origin: left center;
  }
  .rocket-body{
    position:fixed; z-index:30; pointer-events:none;
    width:30px; height:13px;
    background: linear-gradient(90deg, #E8EEF1 0%, #C3CDD3 55%, #8B98A0 100%);
    border-radius:0 7px 7px 0;
    box-shadow: 0 0 8px rgba(255,255,255,0.55), 0 0 2px rgba(0,0,0,0.4) inset;
  }
  .rocket-body::before{
    content:''; position:absolute; right:-11px; top:0.5px;
    border-top:6px solid transparent; border-bottom:6px solid transparent;
    border-left:11px solid #FF6B6B;
  }
  .rocket-body::after{
    content:''; position:absolute; left:-24px; top:1.5px; width:24px; height:10px;
    background: linear-gradient(90deg, rgba(255,201,107,0) 0%, #FFC96B 55%, #FF8F4D 100%);
    border-radius:6px; filter: blur(1px);
    animation: rocketFlicker .1s steps(2) infinite;
  }
  @keyframes rocketFlicker{ 0%{ opacity:0.65; transform:scaleX(0.82); } 100%{ opacity:1; transform:scaleX(1); } }

  .explosion-particle{
    position:fixed; width:8px; height:8px; border-radius:50%;
    pointer-events:none; z-index:31;
    animation: explodeBurst .6s cubic-bezier(.25,.8,.3,1) forwards;
  }
  @keyframes explodeBurst{
    0%{ transform: translate(-50%,-50%) scale(1); opacity:1; }
    100%{ transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.2); opacity:0; }
  }
  .explosion-ring{
    position:fixed; border-radius:50%; border:4px solid; pointer-events:none; z-index:31;
    transform: translate(-50%,-50%);
    animation: explodeRing .5s ease-out forwards;
  }
  @keyframes explodeRing{
    0%{ width:10px; height:10px; opacity:0.9; }
    100%{ width:150px; height:150px; opacity:0; }
  }
  .explosion-flash{
    position:fixed; width:26px; height:26px; border-radius:50%; pointer-events:none; z-index:31;
    background: radial-gradient(circle, #FFFFFF 0%, #FFC96B 40%, rgba(255,140,60,0) 75%);
    transform: translate(-50%,-50%);
    animation: explodeFlash .3s ease-out forwards;
  }
  @keyframes explodeFlash{
    0%{ width:14px; height:14px; opacity:1; }
    100%{ width:90px; height:90px; opacity:0; }
  }

  /* expanding impact ring on every hit */
  .impact-ring{
    position:absolute; left:50%; top:45%; border-radius:50%; border:3px solid;
    transform: translate(-50%,-50%); pointer-events:none; z-index:18;
    animation: ringExpand .55s ease-out forwards;
  }
  @keyframes ringExpand{ 0%{ width:14px; height:14px; opacity:0.85; } 100%{ width:120px; height:120px; opacity:0; } }

  /* ---------- Vector sprites ---------- */
  .tentacle{ transform-box: fill-box; transform-origin: top center; animation: wiggle 2.6s ease-in-out infinite; }
  .t1{ animation-delay: 0s; } .t2{ animation-delay: .22s; } .t3{ animation-delay: .44s; }
  .t4{ animation-delay: .66s; } .t5{ animation-delay: .88s; } .t6{ animation-delay: 1.1s; }
  @keyframes wiggle{ 0%,100%{ transform: rotate(-9deg); } 50%{ transform: rotate(9deg); } }

  .eyes{ transform-box: fill-box; transform-origin: center; animation: blink 4.5s ease-in-out infinite; }
  @keyframes blink{ 0%,90%,100%{ transform: scaleY(1); } 93%{ transform: scaleY(0.12); } }

  .flipper{ transform-box: fill-box; transform-origin: top center; animation: kick .85s ease-in-out infinite alternate; }
  .fl{ animation-delay: 0s; } .fr{ animation-delay: .42s; }
  @keyframes kick{ 0%{ transform: rotate(-10deg); } 100%{ transform: rotate(10deg); } }

  .sprite-glow{ filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)); }

  /* ---------- Pixel-art character sprites ---------- */
  .sprite-frameflip{
    background-repeat:no-repeat;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    width:100%; height:100%;
  }
  .diver-sprite{ background-size:1500% 100%; }
  .shark-sprite{ background-size:900% 100%; }
  .minion-sprite{ background-size:400% 100%; }
  .flip-x{ transform: scaleX(-1); }

  /* boss gets a fiercer tint + glow; minion uses its own distinct small-fry art (see .minion-sprite) */
  .enemy-boss{ filter: saturate(1.25) brightness(1.05) hue-rotate(18deg) drop-shadow(0 0 10px rgba(255,90,60,0.55)); }

  /* death / defeat animation */
  .sprite-death{
    animation: deathSink 1s cubic-bezier(.4,0,.7,1) forwards !important;
  }
  @keyframes deathSink{
    0%{ transform: translateY(0) rotate(0deg); opacity:1; filter: brightness(1); }
    35%{ transform: translateY(6px) rotate(-12deg); opacity:1; filter: brightness(1.3) saturate(0.6); }
    100%{ transform: translateY(80px) rotate(35deg); opacity:0; filter: brightness(0.6) saturate(0.3); }
  }

  /* ---------- Full-bleed battle scene: HUD, characters, and question card
     all layer on top of one continuous ocean background ---------- */
  .aqua-stage-full{
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    width:100%; min-height:100%;
    background: linear-gradient(180deg, #0E3A54 0%, #0A2740 45%, #051524 100%);
    padding: max(1rem, env(safe-area-inset-top, 0px)) clamp(0.75rem, 4vw, 3rem) max(1.25rem, env(safe-area-inset-bottom, 0px));
  }
  .hud-overlay{
    position:relative; z-index:3;
    display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;
    margin-bottom: clamp(1.5rem, 6vh, 3rem);
  }
  .battle-chars-row{
    position:relative; z-index:2;
    flex:1;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 clamp(0.5rem, 4vw, 4rem);
    min-height:140px;
  }
  .question-overlay{
    position:relative; z-index:3;
    display:flex; justify-content:center;
    margin-top: clamp(-2.5rem, -4vh, -1rem);
  }
  .question-overlay .question-panel{ width:100%; max-width:480px; }
  .stage-seafloor{
    position:absolute; left:0; right:0; bottom:0; height:22px;
    background: linear-gradient(180deg, #1C3A2E 0%, #0E1F19 100%);
    box-shadow: 0 -6px 16px -6px rgba(0,0,0,0.5) inset;
  }
  .light-ray{
    position:absolute; top:-15%; width:70px; height:150%;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0));
    filter: blur(6px); opacity:0.45; pointer-events:none;
  }
  .stage-bubble{
    position:absolute; bottom:-8%; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(210,248,252,0.6), rgba(150,220,230,0.05) 70%);
    border:1px solid rgba(210,248,252,0.2);
    animation-name: bubbleRise; animation-timing-function: linear; animation-iteration-count: infinite;
    pointer-events:none;
  }
  @keyframes bubbleRise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.75; }
    100%{ transform: translateY(-210px) translateX(var(--drift, 14px)); opacity:0; }
  }

  /* ---------- Damage numbers + particle bursts (JS-driven) ---------- */
  .dmg-popup{
    position:absolute; left:50%; top:6px; transform: translate(-50%,0);
    font-family:'Orbitron', sans-serif; font-weight:900; font-size:1.35rem;
    pointer-events:none; z-index:20; white-space:nowrap;
    text-shadow: 0 2px 10px rgba(0,0,0,0.65);
    animation: dmgFloat 1s ease-out forwards;
  }
  @keyframes dmgFloat{
    0%{ transform: translate(-50%,0); opacity:0; }
    15%{ opacity:1; }
    100%{ transform: translate(-50%,-58px); opacity:0; }
  }
  .particle{
    position:absolute; width:6px; height:6px; border-radius:50%;
    pointer-events:none; z-index:19; left:50%; top:42%;
    animation: particleBurst .7s cubic-bezier(.25,.8,.3,1) forwards;
  }
  @keyframes particleBurst{
    0%{ transform: translate(-50%,-50%) scale(1); opacity:1; }
    100%{ transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.15); opacity:0; }
  }

  .screen{ display:none; }
  .screen.active{ display:block; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--cyan-dim); border-radius:8px; }

  .toast{
    position:fixed; left:50%; bottom:1.5rem; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border:1px solid var(--cyan); color:var(--foam);
    padding: 0.8rem 1.2rem; border-radius: 12px; font-size:0.9rem; font-weight:600;
    opacity:0; transition: opacity .25s, transform .25s; z-index:50; max-width:90vw; text-align:center;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,0.6);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .buzz-btn{ transition: transform .1s, filter .15s; }
  .buzz-btn:active{ transform: scale(0.95); }
  .buzz-btn.locked{ filter: grayscale(0.6) brightness(0.7); }

  .qtag{
    display:inline-block; font-family:'Press Start 2P', 'Orbitron', sans-serif; font-size:0.6rem;
    color: var(--abyss); background: linear-gradient(180deg,#FFE68A,#FFC96B);
    padding:0.3rem 0.6rem; border-radius:6px; box-shadow: 0 0 10px -1px rgba(255,201,107,0.7);
  }

  #sound-toggle{
    position:fixed; z-index:60;
    top:calc(env(safe-area-inset-top, 0px) + 10px); right:calc(env(safe-area-inset-right, 0px) + 10px);

  #sound-toggle:active{ transform:scale(0.92); }
  #sound-toggle.is-muted{ opacity:0.6; border-color:var(--coral); }
</style>

<body>

<button id="sound-toggle" type="button" aria-label="Toggle sound effects" title="Toggle sound">🔊</button>
<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  /* ===================== Sound effects (Web Audio, synthesized — no audio files) ===================== */
  const Sound = (function(){
    let ctx = null, master = null, noiseBuf = null;
    let muted = false;
    try{ muted = localStorage.getItem('aquamind-muted') === '1'; }catch(e){}

    function ensure(){
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : 0.7;
        const comp = ctx.createDynamicsCompressor();
        master.connect(comp); comp.connect(ctx.destination);
        const len = Math.floor(ctx.sampleRate * 2.5);
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
      }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function tone(o){
      const t0 = ctx.currentTime + (o.t || 0);
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.f, t0);
      if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t0 + o.d);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.v || 0.25, t0 + (o.a || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + o.d + 0.05);
    }

    function noise(o){
      const t0 = ctx.currentTime + (o.t || 0);
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf; src.loop = true;
      const fl = ctx.createBiquadFilter();
      fl.type = o.type || 'lowpass';
      fl.frequency.setValueAtTime(o.f || 1000, t0);
      if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + o.d);
      fl.Q.value = o.q || 1;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.v || 0.3, t0 + (o.a || 0.01));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
      src.connect(fl); fl.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + o.d + 0.05);
    }

    function notes(list, type, v, gap, dur){
      list.forEach((f,i)=> tone({f:f, t:i*gap, d:dur, type:type, v:v}));
    }

    /* ---- Ambient underwater loop: water rumble + slow pad + random bubbles ---- */
    let ambient = null;
    function startAmbient(){
      if(ambient || muted || !ensure()) return;
      const t0 = ctx.currentTime;
      const out = ctx.createGain();
      out.gain.setValueAtTime(0.0001, t0);
      out.gain.exponentialRampToValueAtTime(0.5, t0 + 3);
      out.connect(master);
      const nodes = [];

      // Water rumble: low-passed noise whose cutoff slowly drifts
      const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = 0.7;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.09;
      const lfoG = ctx.createGain(); lfoG.gain.value = 140;
      lfo.connect(lfoG); lfoG.connect(lp.frequency);
      const ng = ctx.createGain(); ng.gain.value = 0.2;
      src.connect(lp); lp.connect(ng); ng.connect(out);
      src.start(); lfo.start();
      nodes.push(src, lfo);

      // Soft pad: detuned triangles (A minor-ish), gently swelling
      const padLP = ctx.createBiquadFilter(); padLP.type = 'lowpass'; padLP.frequency.value = 650;
      const padG = ctx.createGain(); padG.gain.value = 0.045;
      const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.07;
      const lfo2G = ctx.createGain(); lfo2G.gain.value = 0.025;
      lfo2.connect(lfo2G); lfo2G.connect(padG.gain);
      padLP.connect(padG); padG.connect(out);
      [110, 164.8, 220, 261.6, 329.6].forEach((f,i)=>{
        const o = ctx.createOscillator(); o.type = 'triangle';
        o.frequency.value = f; o.detune.value = (i%2 ? 7 : -7);
        o.connect(padLP); o.start(); nodes.push(o);
      });
      lfo2.start(); nodes.push(lfo2);

      // Occasional bubbles
      const state_ = { out, nodes, timer: null };
      (function bubbleLoop(){
        state_.timer = setTimeout(()=>{
          if(ctx.state === 'running' && !muted){
            const f = 420 + Math.random()*700;
            tone({f:f, f2:f*(1.6+Math.random()*0.8), d:0.07+Math.random()*0.08, v:0.05});
            if(Math.random() < 0.4) tone({f:f*1.3, f2:f*2.2, t:0.09, d:0.07, v:0.035});
          }
          bubbleLoop();
        }, 900 + Math.random()*2600);
      })();
      ambient = state_;
    }

    function stopAmbient(){
      if(!ambient) return;
      const a = ambient; ambient = null;
      clearTimeout(a.timer);
      try{
        const t = ctx.currentTime;
        a.out.gain.cancelScheduledValues(t);
        a.out.gain.setValueAtTime(Math.max(0.0001, a.out.gain.value), t);
        a.out.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        a.nodes.forEach(n=>{ try{ n.stop(t + 0.5); }catch(e){} });
      }catch(e){}
    }

    // Save CPU/battery (and stay quiet) when the tab is hidden
    document.addEventListener('visibilitychange', ()=>{
      if(!ctx) return;
      if(document.hidden) ctx.suspend();
      else if(!muted) ctx.resume();
    });

    const FX = {
      click(){ tone({f:520, f2:880, d:0.08, v:0.18}); },
      start(){ notes([523,659,784,1047], 'square', 0.12, 0.09, 0.22); noise({type:'highpass', f:3000, d:0.3, v:0.05, t:0.3}); },
      swim(){ noise({type:'bandpass', f:250, f2:900, q:2, d:0.55, v:0.16, a:0.2}); },
      boss(){
        tone({f:95, f2:45, d:1.0, type:'sawtooth', v:0.3});
        tone({f:100, f2:48, d:1.0, type:'square', v:0.12});
        noise({type:'lowpass', f:500, f2:90, d:1.0, v:0.25});
      },
      buzz(){ tone({f:660, d:0.12, type:'square', v:0.18}); tone({f:990, t:0.1, d:0.2, type:'square', v:0.18}); },
      correct(){ notes([659,880,1319], 'triangle', 0.25, 0.08, 0.22); },
      wrong(){ tone({f:220, f2:110, d:0.35, type:'sawtooth', v:0.2}); tone({f:185, f2:92, t:0.14, d:0.4, type:'sawtooth', v:0.2}); },
      rocket(ms){
        const d = Math.max(0.4, (ms || 1500) / 1000);
        tone({f:220, f2:55, d:0.18, v:0.35});
        noise({type:'bandpass', f:400, f2:2400, q:1.5, d:d, v:0.22, a:d*0.4});
        tone({f:110, f2:420, d:d, type:'sawtooth', v:0.06, a:d*0.4});
      },
      explosion(){
        noise({type:'lowpass', f:3200, f2:180, d:0.75, v:0.6, a:0.004});
        tone({f:130, f2:28, d:0.65, v:0.5});
        noise({type:'highpass', f:2500, d:0.25, v:0.18});
      },
      playerHit(){ noise({type:'bandpass', f:900, f2:200, q:1, d:0.28, v:0.4}); tone({f:190, f2:60, d:0.28, type:'square', v:0.18}); },
      monsterHit(){ tone({f:520, f2:200, d:0.2, type:'triangle', v:0.3}); noise({type:'bandpass', f:1500, q:2, d:0.1, v:0.2}); },
      death(){
        tone({f:420, f2:40, d:1.1, type:'sawtooth', v:0.25});
        noise({type:'lowpass', f:1400, f2:100, d:1.1, v:0.3});
        for(let i=0;i<5;i++) tone({f:500+Math.random()*700, f2:1200+Math.random()*600, t:0.15+i*0.11, d:0.07, v:0.1});
      },
      lunge(){
        noise({type:'bandpass', f:200, f2:1300, q:1.5, d:0.35, v:0.25, a:0.15});
        tone({f:150, f2:320, d:0.3, type:'sawtooth', v:0.1});
        noise({type:'highpass', f:1800, t:0.28, d:0.1, v:0.2});
      },
      lowhp(){ tone({f:880, d:0.1, type:'square', v:0.1}); tone({f:880, t:0.2, d:0.1, type:'square', v:0.1}); },
      error(){ tone({f:200, d:0.14, type:'square', v:0.13}); tone({f:160, t:0.16, d:0.18, type:'square', v:0.13}); },
      victory(){
        notes([523,659,784,1047], 'square', 0.16, 0.13, 0.3);
        [523,659,784,1047].forEach(f=>tone({f:f, t:0.55, d:1.1, type:'triangle', v:0.14}));
      },
      defeat(){ notes([392,330,262,196], 'triangle', 0.26, 0.3, 0.5); },
      draw(){ notes([440,440,392], 'triangle', 0.22, 0.22, 0.35); }
    };

    function play(name, arg){
      if(muted) return;
      try{
        if(!ensure()) return;
        if(FX[name]) FX[name](arg);
      }catch(e){ /* audio is non-essential */ }
    }

    function setMuted(m){
      muted = m;
      try{ localStorage.setItem('aquamind-muted', m ? '1' : '0'); }catch(e){}
      if(master) master.gain.value = m ? 0 : 0.7;
      if(m) stopAmbient(); else if(ctx) startAmbient();
      const btn = document.getElementById('sound-toggle');
      if(btn){ btn.textContent = m ? '🔇' : '🔊'; btn.classList.toggle('is-muted', m); }
    }

    // Browsers only allow audio after a user gesture — unlock on first interaction.
    ['pointerdown','keydown','touchend'].forEach(evt=>{
      window.addEventListener(evt, ()=>{ if(!muted){ ensure(); startAmbient(); } }, {passive:true});
    });

    // Soft click on buttons / mode options (buzzers have their own sound).
    document.addEventListener('pointerdown', e=>{
      const el = e.target.closest && e.target.closest('button, .mode-option');
      if(!el || el.id === 'sound-toggle' || el.classList.contains('buzz-btn') || el.disabled) return;
      play('click');
    });

    const toggleBtn = document.getElementById('sound-toggle');
    toggleBtn.addEventListener('click', ()=>{
      const willMute = !muted;
      if(!willMute){ setMuted(false); ensure(); startAmbient(); play('click'); }
      else setMuted(true);
    });
    setMuted(muted);

    return { play };
  })();
  function sfx(name, arg){ Sound.play(name, arg); }

  /* ===================== Canvas caustics (animated background light) ===================== */
  const causticsCanvas = document.getElementById('caustics-canvas');
  const cctx = causticsCanvas.getContext('2d');
  let cw = 0, ch = 0;
  function resizeCaustics(){
    cw = causticsCanvas.width = window.innerWidth;
    ch = causticsCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCaustics);
  resizeCaustics();

  let causticsTime = 0;
  function drawCaustics(){
    causticsTime += 0.012;
    cctx.clearRect(0,0,cw,ch);
    cctx.globalCompositeOperation = 'lighter';
    const bands = 7;
    for(let i=0;i<bands;i++){
      cctx.beginPath();
      const yBase = (ch/bands) * i + (ch/bands)/2;
      const amp = 16 + (i % 3) * 6;
      for(let x=0; x<=cw; x += 24){
        const y = yBase + Math.sin(x*0.012 + causticsTime*1.4 + i*1.3) * amp
                        + Math.sin(x*0.004 - causticsTime*0.6 + i) * (amp*0.6);
        if(x === 0) cctx.moveTo(x,y); else cctx.lineTo(x,y);
      }
      cctx.strokeStyle = 'rgba(77,232,224,' + (0.035 + (i%2)*0.02) + ')';
      cctx.lineWidth = 22;
      cctx.stroke();
    }
    requestAnimationFrame(drawCaustics);
  }
  drawCaustics();

  /* ===================== Ambient bubbles ===================== */
  const bubbleField = document.getElementById('bubble-field');
  function spawnBubbles(n){
    for(let i=0;i<n;i++){
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 6 + Math.random()*22;
      b.style.width = size+'px';
      b.style.height = size+'px';
      b.style.left = Math.random()*100+'vw';
      b.style.setProperty('--drift', (Math.random()*60-30)+'px');
      const dur = 9 + Math.random()*10;
      b.style.animationDuration = dur+'s';

  function fireHarpoon(fromCardId, toCardId){
    const fromEl = document.getElementById(fromCardId);
    const toEl = document.getElementById(toCardId);
    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();
    const startX = fromRect.left + fromRect.width/2;
    const startY = fromRect.top + fromRect.height/2;
    const endX = toRect.left + toRect.width/2;
    const endY = toRect.top + toRect.height/2;
    const dx = endX - startX, dy = endY - startY;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const dist = Math.hypot(dx, dy);

    const dart = document.createElement('div');
    dart.className = 'harpoon-dart';
    dart.style.left = startX + 'px';
    dart.style.top = startY + 'px';
    dart.style.width = dist + 'px';
    dart.style.transform = `rotate(${angle}deg) scaleX(0)`;
    dart.style.transition = 'transform .26s cubic-bezier(.2,.8,.2,1), opacity .2s ease .18s';
    document.body.appendChild(dart);
    requestAnimationFrame(()=>{
      dart.style.transform = `rotate(${angle}deg) scaleX(1)`;
      dart.style.opacity = '0';
    });
    setTimeout(()=>dart.remove(), 320);
  }

  function spawnExplosion(x, y, color){
    sfx('explosion');
    const flash = document.createElement('div');
    flash.className = 'explosion-flash';
    flash.style.left = x + 'px';
    flash.style.top = y + 'px';
    document.body.appendChild(flash);

    const ring = document.createElement('div');
    ring.className = 'explosion-ring';
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    ring.style.borderColor = color || '#FFC96B';
    document.body.appendChild(ring);
    setTimeout(()=>ring.remove(), 520);

    for(let i=0;i<16;i++){
      const p = document.createElement('div');
      p.className = 'explosion-particle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random()*70;
      p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = i % 2 === 0 ? (color || '#FFC96B') : '#FF6B6B';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 650);
    }
  }

  function fireRocket(fromCardId, toCardId, durationMs, onImpact){
    const fromEl = document.getElementById(fromCardId);
    const toEl = document.getElementById(toCardId);
    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();
    const startX = fromRect.left + fromRect.width/2;
    const startY = fromRect.top + fromRect.height/2;
    const endX = toRect.left + toRect.width/2;
    const endY = toRect.top + toRect.height/2;

    // Curve via a quadratic Bezier: control point is offset perpendicular to the
    // straight line between start and end, so the rocket arcs instead of flying direct.
    const dx = endX - startX, dy = endY - startY;
    const dist = Math.hypot(dx, dy) || 1;
    const nx = -dy / dist, ny = dx / dist; // unit vector perpendicular to the flight line
    const curveSide = (fromCardId === 'card-p1') ? -1 : 1; // arc upward when fired left-to-right, and mirror otherwise
    const bow = Math.min(160, Math.max(60, dist * 0.35)) * curveSide;
    const midX = (startX + endX) / 2 + nx * bow;
    const midY = (startY + endY) / 2 + ny * bow;

    function pointAt(t){
      const mt = 1 - t;
      return {
        x: mt*mt*startX + 2*mt*t*midX + t*t*endX,
        y: mt*mt*startY + 2*mt*t*midY + t*t*endY
      };
    }
    function tangentAngleAt(t){
      const mt = 1 - t;
      const tx = 2*mt*(midX - startX) + 2*t*(endX - midX);
      const ty = 2*mt*(midY - startY) + 2*t*(endY - midY);
      return Math.atan2(ty, tx) * 180 / Math.PI;
    }

    const rocket = document.createElement('div');
    rocket.className = 'rocket-body';
    sfx('rocket', durationMs);
    document.body.appendChild(rocket);

    const startTime = performance.now();
    function frame(now){
      const t = Math.min(1, (now - startTime) / durationMs);
      const p = pointAt(t);
      const angle = tangentAngleAt(t);
      rocket.style.left = p.x + 'px';
      rocket.style.top = p.y + 'px';
      rocket.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`;
      if(t < 1){
        requestAnimationFrame(frame);
      } else {
        rocket.remove();
        spawnExplosion(endX, endY, '#FFC96B');
        if(onImpact) onImpact();
      }
    }
    requestAnimationFrame(frame);
  }


  function pauseFloat(cardEl){
    const hadFloat = cardEl.classList.contains('animate-float');
    if(hadFloat) cardEl.classList.remove('animate-float');
    return hadFloat;

    const hadFloat = pauseFloat(cardEl);
    cardEl.classList.add('recoil-hit');
    setTimeout(()=>{
      cardEl.classList.remove('recoil-hit');
      if(hadFloat) cardEl.classList.add('animate-float');
    }, 520);
  }

  function triggerLunge(cardEl){

    const hadFloat = pauseFloat(cardEl);
    cardEl.classList.add('lunge');
    setTimeout(()=>{
      cardEl.classList.remove('lunge');
      if(hadFloat) cardEl.classList.add('animate-float');
    }, 420);
  }

    const cls = fromSide === 'left' ? 'swim-in-left' : 'swim-in-right';
    cardEl.classList.add(cls);

    }, 650);

  /* ===================== Game state ===================== */
  const state = {
    config: {},
    questions: [],
    currentIndex: 0,
    p1: { name:"You", hp:100, maxHp:100 },
    p2: { name:"Sea Monster", hp:100, maxHp:100 },
    mode: "pve",
    activePvpPlayer: null,
    review: [],
    totalScore: 0,
    totalMax: 0,
    currentEnemy: null,   // { type:'minion'|'boss', hitsRemaining, maxHits } — PvE only
    bossSpawned: false
  };

  const DAMAGE_MIN = 18, DAMAGE_MAX = 30;
  function rollDamage(){ return Math.floor(DAMAGE_MIN + Math.random()*(DAMAGE_MAX-DAMAGE_MIN)); }

  /* ===================== Setup form ===================== */
  document.querySelectorAll('.mode-option').forEach(label=>{
    label.addEventListener('click', ()=>{
      document.querySelectorAll('.mode-option').forEach(l=>l.style.borderColor = 'var(--line)');
      setTimeout(()=>{
        const checked = label.querySelector('input').checked;
        if(checked) label.style.borderColor = 'var(--cyan)';
      },0);
    });
  });

  document.getElementById('setup-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const startBtn = document.getElementById('start-btn');
    const statusEl = document.getElementById('setup-status');

    state.config = {
      topic: document.getElementById('f-topic').value.trim() || "General Knowledge",
      difficulty: document.getElementById('f-difficulty').value,
      mode: document.querySelector('input[name="mode"]:checked').value,
      qtype: document.getElementById('f-qtype').value
    };
    state.mode = state.config.mode;

    startBtn.disabled = true;
    startBtn.textContent = "⏳ SUMMONING QUESTIONS…";
    statusEl.textContent = "";

    hideErrorBox('setup-error');
    try{
      state.questions = await generateQuestions(state.config);
    }catch(err){
      console.error("Question generation failed:", err);
      showErrorBox('setup-error', describeAIError(err));
      startBtn.disabled = false;
      startBtn.textContent = "⚡ START GAME";
      return;
    }

    initBattle();
    showScreen('screen-battle');
    sfx('start');
    startBtn.disabled = false;
    startBtn.textContent = "⚡ START GAME";
  });

  /* ===================== AI integration (via Netlify Function proxy) =====================
     The real API key lives server-side as a Netlify environment variable and is read by
     netlify/functions/llm-proxy.js (currently backed by Groq) — it never reaches the
     browser or the page source. To switch providers again later, just point the fetch
     path below at a different function and swap the function's own upstream call. */
  const AI_ENDPOINT = "/.netlify/functions/llm-proxy";

  class AIError extends Error{
    constructor(message, opts){
      super(message);
      this.name = 'AIError';
      Object.assign(this, opts || {});
    }
  }

  async function callAI(messages, jsonMode){
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 25000);
    try{
      const res = await fetch(AI_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: controller.signal,
        body: JSON.stringify({ messages: messages, jsonMode: !!jsonMode })
      });
      const raw = await res.text();
      let data = null;
      try{ data = JSON.parse(raw); }catch(_){ /* not JSON */ }

      if(!res.ok){
        let msg = '';
        if(data){
          const errField = data.error;
          msg = (typeof errField === 'string') ? errField : (errField && errField.message) || '';
          if(data.detail) msg += (msg ? ' — ' : '') + data.detail;
        }
        throw new AIError(msg || ('HTTP ' + res.status), { status: res.status, raw: raw.slice(0, 300), source: data && data.source });
      }
      if(!data){
        throw new AIError('The proxy answered with something that is not JSON: ' + raw.slice(0, 120), { code:'NOT_JSON', status: res.status });
      }
      const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!content){
        throw new AIError('The AI response had no message content: ' + raw.slice(0, 200), { code:'EMPTY' });
      }
      return content;
    } finally {
      clearTimeout(timeout);
    }
  }

  /* Turn any failure into { title, detail, hint } so the exact problem is visible on screen. */
  function describeAIError(err){
    const info = { title: 'Something went wrong', detail: String((err && err.message) || err), hint: '' };
    const status = err && err.status;

    if(err && err.name === 'AbortError'){
      info.title = 'Request timed out';
      info.detail = 'No answer from ' + AI_ENDPOINT + ' after 25 seconds.';
      info.hint = 'Check Netlify → Logs → Functions → llm-proxy for errors, and check that Groq is reachable.';
    } else if(err instanceof TypeError){
      info.title = 'Could not reach the proxy';
      info.detail = err.message + '  (' + AI_ENDPOINT + ')';
      info.hint = (location.protocol === 'file:')
        ? 'You opened the page as a local file. The proxy only exists on your deployed Netlify site — open your Netlify URL instead.'
        : 'Network problem, or the function is not deployed. Open ' + AI_ENDPOINT + ' in a new browser tab: "Method not allowed" means the function is live; a "Page not found" means it is not deployed.';
    } else if(err && err.code === 'NOT_JSON'){
      info.title = 'Proxy returned a non-JSON page';
      info.hint = 'This usually means the function is not deployed and Netlify is serving a normal web page instead. Check Netlify → Deploys → latest deploy → Functions.';
    } else if(err && (err.code === 'BAD_JSON' || err.code === 'BAD_FORMAT' || err.code === 'EMPTY')){
      info.title = 'The AI replied in an unexpected format';
      info.hint = 'The proxy and key work, but the model returned something the game could not read. Try again.';
    } else if(err && err.source === 'groq'){
      // The proxy is working and reached Groq; this is what Groq itself said.
      if(status === 401 || status === 403){
        info.title = 'Groq rejected the API key (' + status + ')';
        info.hint = 'The key is invalid, revoked, or was pasted with extra spaces. Fix GROQ_API_KEY in Netlify and redeploy.';
      } else if(status === 429){
        info.title = 'Groq rate limit / quota reached (429)';
        info.hint = 'Wait a minute and try again, or check your usage limits in the Groq console.';
      } else if(/model|decommission|does not exist|not found/i.test(info.detail)){
        info.title = 'Groq says this model is unavailable (' + status + ')';
        info.hint = 'Groq retires models over time (llama-3.3-70b-versatile was shut down on Aug 16, 2026). In Netlify add an environment variable GROQ_MODEL set to a current model such as openai/gpt-oss-120b (see console.groq.com/docs/models), then trigger a new deploy.';
      } else {
        info.title = 'Groq returned an error (' + status + ')';
        info.hint = 'Your proxy and key are working and reached Groq. The message above is what Groq replied.';
      }
    } else if(status === 404){
      info.title = 'Function not found (404)';
      info.detail = 'Netlify has no function at ' + AI_ENDPOINT;
      info.hint = 'Check that the repo contains netlify/functions/llm-proxy.js (exact folder names, at the repo root), that netlify.toml has functions = "netlify/functions", then look at Netlify → Deploys → latest deploy → Functions.';
    } else if(status === 500 && /GROQ_API_KEY/i.test(info.detail)){
      info.title = 'API key is not set on Netlify';
      info.hint = 'Add GROQ_API_KEY under Site configuration → Environment variables, then trigger a NEW deploy (environment variable changes only apply to new deploys).';
    } else if(status === 401 || status === 403){
      info.title = 'Groq rejected the API key (' + status + ')';
      info.hint = 'The key is invalid, revoked, or was pasted with extra spaces. Fix GROQ_API_KEY in Netlify and redeploy.';
    } else if(status === 429){
      info.title = 'Groq rate limit / quota reached (429)';
      info.hint = 'Wait a minute and try again, or check your usage limits in the Groq console.';
    } else if(status === 400){
      info.title = 'Groq rejected the request (400)';
      info.hint = 'Usually a wrong model name or bad request body. Check the model in netlify/functions/llm-proxy.js.';
    } else if(status === 502){
      info.title = 'The proxy could not reach Groq (502)';
      info.hint = 'Groq may be down, or the function timed out. Check Netlify → Logs → Functions.';
    } else if(status >= 500){
      info.title = 'Proxy error (' + status + ')';
      info.hint = 'Check Netlify → Logs → Functions → llm-proxy for the stack trace.';
    } else if(status){
      info.title = 'Request failed (' + status + ')';
    }
    return info;
  }

  function showErrorBox(id, info){
    sfx('error');
    document.getElementById(id + '-title').textContent = info.title;
    document.getElementById(id + '-detail').textContent = info.detail;
    document.getElementById(id + '-hint').textContent = info.hint;
    document.getElementById(id).classList.remove('hidden');
  }
  function hideErrorBox(id){
    document.getElementById(id).classList.add('hidden');
  }

  function extractJson(text){
    const cleaned = text.replace(/```json|```/g, "").trim();
    const start = cleaned.indexOf('{');
    const arrStart = cleaned.indexOf('[');
    let jsonStr = cleaned;
    if(start !== -1 && (arrStart === -1 || start < arrStart)){
      jsonStr = cleaned.slice(start);
    } else if(arrStart !== -1){
      jsonStr = cleaned.slice(arrStart);
    }
    return JSON.parse(jsonStr);
  }

  const QUESTION_COUNT_BY_DIFFICULTY = { Easy: 5, Medium: 10, Hard: 15 };

  async function generateQuestions(cfg){
    const qCount = QUESTION_COUNT_BY_DIFFICULTY[cfg.difficulty] || 5;
    const typeInstruction = cfg.qtype === "mixed"
      ? "Mix multiple_choice and short_answer question types roughly evenly."
      : (cfg.qtype === "mcq" ? "All questions must be type 'multiple_choice'." : "All questions must be type 'short_answer'.");

    const systemPrompt = `You are a quiz generator for an educational game called AquaMind. Respond with ONLY a raw JSON object, no markdown, no commentary. The JSON object must have a "questions" array of exactly ${qCount} items. Each item must have:
- "type": "multiple_choice" or "short_answer"
- "question": string
- for multiple_choice: "choices" (array of 4 strings) and "correct_answer" (must exactly match one choice)
- for short_answer: "ideal_answer" (string) and "rubric" (string describing how to score 0-2 points)
- "explanation": a short string explaining the correct answer

${typeInstruction}`;

    const userPrompt = `Topic: ${cfg.topic}\nDifficulty: ${cfg.difficulty}\nGenerate the questions now as raw JSON only.`;

    const content = await callAI([
      { role: "system", content: systemPrompt },
      { role: "user", content: userPrompt }
    ], true);

    let parsed;
    try{ parsed = extractJson(content); }
    catch(e){ throw new AIError("The AI reply was not valid JSON. Start of reply: " + content.slice(0, 150), { code:'BAD_JSON' }); }
    const list = parsed.questions || parsed;
    if(!Array.isArray(list) || list.length === 0) throw new AIError("The AI reply had no questions array: " + JSON.stringify(parsed).slice(0, 150), { code:'BAD_FORMAT' });

    const normalized = list.map(q=>({
      type: q.type === "short_answer" ? "short" : "mcq",
      question: q.question,
      choices: q.choices,
      correct_answer: q.correct_answer,
      ideal_answer: q.ideal_answer,
      rubric: q.rubric,
      explanation: q.explanation || ""
    })).filter(q=>q.question && (q.type === "short" || (Array.isArray(q.choices) && q.correct_answer)));

    if(normalized.length === 0) throw new AIError("None of the AI questions had the required fields.", { code:'BAD_FORMAT' });
    return normalized;
  }

  async function gradeShortAnswer(cfg, question, studentAnswer){
    const systemPrompt = `You are grading a student's short-answer response for an educational game. Respond with ONLY a raw JSON object: {"score": number, "max_score": 2, "feedback": string}. Score from 0 to 2 based on the rubric provided. Feedback should be one short encouraging sentence explaining the score.`;
    const userPrompt = `Question: ${question.question}\nIdeal answer: ${question.ideal_answer || "N/A"}\nRubric: ${question.rubric || "Award full marks for a correct, relevant answer; partial marks for a partially correct answer; zero for incorrect or unrelated answers."}\nStudent answer: ${studentAnswer}\n\nRespond with raw JSON only.`;
    const content = await callAI([
      { role: "system", content: systemPrompt },
      { role: "user", content: userPrompt }
    ], true);
    let parsed;
    try{ parsed = extractJson(content); }
    catch(e){ throw new AIError("The grader's reply was not valid JSON. Start of reply: " + content.slice(0, 150), { code:'BAD_JSON' }); }
    const score = Math.max(0, Math.min(2, Number(parsed.score)));
    if(isNaN(score)) throw new AIError("The grader returned an invalid score: " + JSON.stringify(parsed).slice(0, 150), { code:'BAD_FORMAT' });
    return { score, max_score: 2, feedback: parsed.feedback || "" };
  }

  /* JS-driven sprite frame stepper.
     CSS steps()-timing against a percentage background-position doesn't land on exact
     frame boundaries for every frame (the math only lines up for a couple of frames and
     drifts for the rest), which is what caused two frames to blend together on-screen.
     Setting background-position-x directly to k/(frameCount-1)*100% each tick is exact
     for any container size, so we drive it from JS instead. */
  const spriteTimers = {};
  function startFrameLoop(elId, frameCount, cycleMs){
    const el = document.getElementById(elId);
    if(spriteTimers[elId]){ clearInterval(spriteTimers[elId]); delete spriteTimers[elId]; }
    if(!frameCount || frameCount <= 1){
      el.style.backgroundPositionX = '0%';
      return;
    }
    let idx = 0;
    const setFrame = () => {
      el.style.backgroundPositionX = (idx / (frameCount - 1)) * 100 + '%';
      idx = (idx + 1) % frameCount;
    };
    setFrame();
    spriteTimers[elId] = setInterval(setFrame, cycleMs / frameCount);
  }

  function setSprite(elId, kind, variant){
    const el = document.getElementById(elId);
    const baseClasses = elId === 'p1-sprite'
      ? 'mx-auto w-32 h-32 sm:w-44 sm:h-44 sprite-glow'
      : 'mx-auto w-36 h-36 sm:w-48 sm:h-48 sprite-glow';
    const flip = elId === 'p2-sprite' ? -1 : 1;

    if(kind === 'diver'){
      el.className = [baseClasses, 'sprite-frameflip', 'diver-sprite'].filter(Boolean).join(' ');
      el.style.backgroundImage = 'url(' + DIVER_SHEET + ')';
      el.style.transform = flip < 0 ? 'scaleX(-1)' : '';
      startFrameLoop(elId, 15, 2400);
    } else if(variant === 'minion'){
      el.className = [baseClasses, 'sprite-frameflip', 'minion-sprite'].filter(Boolean).join(' ');
      el.style.backgroundImage = 'url(' + MINION_SHEET + ')';
      el.style.transform = `scale(${flip*0.55}, 0.55)`;
      startFrameLoop(elId, 4, 700);
    } else {
      const variantClass = variant === 'boss' ? 'enemy-boss' : '';
      el.className = [baseClasses, 'sprite-frameflip', 'shark-sprite', variantClass].filter(Boolean).join(' ');
      el.style.backgroundImage = 'url(' + SHARK_SHEET + ')';
      const scaleAmt = variant === 'boss' ? 1.85 : 1;
      el.style.transform = `scale(${scaleAmt}, ${scaleAmt})`;
      startFrameLoop(elId, 9, 1500);
    }
  }

  /* ----- PvE enemy wave logic: disposable minions (1-hit kill) + a tougher boss ----- */
  function decideNextEnemy(){
    const remaining = state.questions.length - state.currentIndex; // includes current question
    if(!state.bossSpawned && remaining <= 2 && state.questions.length >= 2){
      state.bossSpawned = true;
      return { type: 'boss', hitsRemaining: 2, maxHits: 2 };
    }
    return { type: 'minion', hitsRemaining: 1, maxHits: 1 };
  }

  function spawnEnemyVisual(enemy){
    // The previous enemy's death animation leaves this card faded out (opacity 0, sunk and
    // rotated). Reset every leftover animation class so the new enemy is actually visible.
    resetCardFx('card-p2');

    state.p2.hp = enemy.hitsRemaining;
    if(enemy.type === 'boss') sfx('boss');
    state.p2.maxHp = enemy.maxHits;
    state.p2.name = enemy.type === 'boss' ? 'Boss Shark' : 'Minion Fish';
    document.getElementById('hud-p2-name').textContent = enemy.type === 'boss' ? 'BOSS' : 'MINION';
    document.getElementById('p2-label').textContent = enemy.type === 'boss' ? 'Boss Shark' : 'Minion';
    setSprite('p2-sprite', 'shark', enemy.type);
    document.getElementById('card-p2').classList.add('animate-float');
    updateHpBar('p2');
    playEntrance(document.getElementById('card-p2'), 'right');
  }

  function ensureEnemy(){
    if(state.mode !== 'pve') return;
    if(!state.currentEnemy || state.currentEnemy.hitsRemaining <= 0){
      state.currentEnemy = decideNextEnemy();
      spawnEnemyVisual(state.currentEnemy);
    }
  }

  /* ===================== Battle setup ===================== */
  function resetCardFx(cardId){
    const card = document.getElementById(cardId);
    card.classList.remove('sprite-death','recoil-hit','lunge','animate-hit','flash-red','swim-in-left','swim-in-right');
    void card.offsetWidth; // force a reflow so entrance/idle animations restart cleanly
  }

  function initBattle(){
    state.currentIndex = 0;
    state.review = [];
    state.totalScore = 0;
    state.totalMax = 0;
    state.p1 = { name: "You", hp: 100, maxHp: 100 };
    state.currentEnemy = null;
    state.bossSpawned = false;

    // A previous match's death animation leaves a card faded out, sunk, and
    // rotated (opacity 0, via animation-fill-mode: forwards). Without this,
    // a fresh game could visually start with the player already "dead" if
    // they lost the last match.
    resetCardFx('card-p1');
    resetCardFx('card-p2');

    if(state.mode === "pvp"){
      state.p2 = { name: "Player 2", hp: 100, maxHp: 100 };
      document.getElementById('hud-p1-name').textContent = "PLAYER 1";
      document.getElementById('hud-p2-name').textContent = "PLAYER 2";
      document.getElementById('p1-label').textContent = "Player 1";
      document.getElementById('p2-label').textContent = "Player 2";
      setSprite('p1-sprite', 'diver');
      setSprite('p2-sprite', 'diver');
      document.getElementById('card-p2').classList.remove('animate-float');
      updateHpBar('p1');
      updateHpBar('p2');
      playEntrance(document.getElementById('card-p1'), 'left');
      playEntrance(document.getElementById('card-p2'), 'right');
    } else {
      state.p2 = { name: "Sea Monster", hp: 1, maxHp: 1 };
      document.getElementById('hud-p1-name').textContent = "YOU";
      document.getElementById('p1-label').textContent = "You";
      setSprite('p1-sprite', 'diver');
      updateHpBar('p1');
      playEntrance(document.getElementById('card-p1'), 'left');
    }

    renderQuestion();
  }

  function updateHpBar(who){
    const p = state[who];
    const pct = Math.max(0, Math.round((p.hp / p.maxHp) * 100));
    const fill = document.getElementById('hp-'+who);
    const text = document.getElementById('hud-'+who+'-hp-text');
    fill.style.width = pct + '%';
    text.textContent = Math.max(0,p.hp) + '/' + p.maxHp;
    const wasLow = fill.classList.contains('low-hp');
    const nowLow = pct > 0 && pct <= 30;
    fill.classList.toggle('low-hp', nowLow);
    if(nowLow && !wasLow) sfx('lowhp');
  }

  function dealDamage(who, amount){
    const cardId = who === 'p1' ? 'card-p1' : 'card-p2';
    const card = document.getElementById(cardId);
    const isMonster = (state.mode === 'pve' && who === 'p2');

    if(isMonster){
      state.p2.hp = Math.max(0, state.p2.hp - 1);
      if(state.currentEnemy){ state.currentEnemy.hitsRemaining = state.p2.hp; }
    } else {
      state[who].hp = Math.max(0, state[who].hp - amount);
    }
    updateHpBar(who);

    const isDead = state[who].hp <= 0;
    sfx(isDead ? 'death' : (isMonster ? 'monsterHit' : 'playerHit'));

    if(isDead){
      triggerDeath(card, isMonster);
    } else if(isMonster){
      triggerRecoil(card);
    } else {
      card.classList.add('animate-hit','flash-red');
      setTimeout(()=>card.classList.remove('animate-hit','flash-red'), 450);
    }

    const dmgColor = isMonster ? '#FFC96B' : '#FF6B6B';
    const dmgLabel = isDead ? 'DEFEATED' : (isMonster ? 'HIT!' : ('-' + amount));
    spawnDamageNumber(cardId, dmgLabel, dmgColor);
    spawnParticles(cardId, dmgColor, isDead ? 22 : (amount > 25 ? 14 : 9));
    spawnImpactRing(cardId, dmgColor);
    if(isDead){ spawnImpactRing(cardId, dmgColor); }

    const tier = amount > 26 ? 'shake-lg' : (amount > 21 ? 'shake-md' : 'shake-sm');
    shakeApp(isDead ? 'shake-lg' : tier);

    if(who === 'p1'){ pulseVignette(); }
  }

  function triggerDeath(cardEl, wasMonster){
    cardEl.classList.remove('animate-float','recoil-hit','lunge','animate-hit','flash-red');
    cardEl.classList.add('sprite-death');
  }

  /* ===================== Question rendering ===================== */
  function currentQuestion(){ return state.questions[state.currentIndex]; }

  function renderQuestion(){
    const q = currentQuestion();
    if(!q){ return endBattle(); }

    ensureEnemy();

    document.getElementById('q-counter').textContent = `Question ${state.currentIndex+1}/${state.questions.length}`;
    document.getElementById('q-type-tag').textContent = q.type === 'mcq' ? 'MCQ' : 'SHORT ANSWER';
    document.getElementById('q-text').textContent = q.question;

    const mcqBox = document.getElementById('mcq-choices');
    const shortBox = document.getElementById('short-answer-box');
    const buzzerRow = document.getElementById('buzzer-row');
    mcqBox.innerHTML = '';
    shortBox.classList.add('hidden');
    document.getElementById('short-answer-input').value = '';
    hideErrorBox('battle-error');
    state.activePvpPlayer = null;

    const isPvp = state.mode === 'pvp';
    buzzerRow.classList.toggle('hidden', !isPvp);
    document.getElementById('buzz-p1').classList.remove('locked');
    document.getElementById('buzz-p2').classList.remove('locked');
    document.getElementById('buzz-p1').disabled = false;
    document.getElementById('buzz-p2').disabled = false;

    function unlockAnswering(){
      if(q.type === 'mcq'){
        renderMcqChoices(q);
      } else {
        shortBox.classList.remove('hidden');
      }
    }

    if(isPvp){
      mcqBox.innerHTML = '<p class="text-sm text-center py-4" style="color:var(--foam-dim)">Buzz in to answer!</p>';
      document.getElementById('buzz-p1').onclick = ()=>lockBuzzer('p1', unlockAnswering);
      document.getElementById('buzz-p2').onclick = ()=>lockBuzzer('p2', unlockAnswering);
    } else {
      unlockAnswering();
    }
  }

  function lockBuzzer(who, cb){
    if(state.activePvpPlayer) return;
    state.activePvpPlayer = who;
    sfx('buzz');
    document.getElementById('buzz-p1').disabled = true;
    document.getElementById('buzz-p2').disabled = true;
    document.getElementById('buzz-'+who).classList.remove('locked');
    document.getElementById(who === 'p1' ? 'buzz-p2' : 'buzz-p1').classList.add('locked');
    toast((who === 'p1' ? state.p1.name : state.p2.name) + " buzzed in!", 1200);
    cb();
  }

  function renderMcqChoices(q){
    const mcqBox = document.getElementById('mcq-choices');
    mcqBox.innerHTML = '';
    q.choices.forEach(choice=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice;
      btn.addEventListener('click', ()=>handleMcqAnswer(choice, btn));
      mcqBox.appendChild(btn);
    });
  }

  function handleMcqAnswer(choice, btnEl){
    const q = currentQuestion();
    const isCorrect = choice === q.correct_answer;
    document.querySelectorAll('#mcq-choices .choice-btn').forEach(b=>{
      b.disabled = true;
      if(b.textContent === q.correct_answer) b.classList.add('is-correct');
      else if(b === btnEl && !isCorrect) b.classList.add('is-wrong');
    });

    logAndResolve({
      question: q.question,
      type: 'mcq',
      chosen: choice,
      correct: q.correct_answer,
      explanation: q.explanation,
      earned: isCorrect ? 1 : 0,
      max: 1
    }, isCorrect);
  }

  document.getElementById('submit-short').addEventListener('click', async ()=>{
    const q = currentQuestion();
    const input = document.getElementById('short-answer-input');
    const answer = input.value.trim();
    if(!answer){ sfx('error'); toast("Type an answer first!", 1400); return; }
    const btn = document.getElementById('submit-short');
    btn.disabled = true;
    btn.textContent = "Grading…";
    hideErrorBox('battle-error');

    let result;
    try{
      result = await gradeShortAnswer(state.config, q, answer);
    }catch(err){
      console.error("Grading failed:", err);
      showErrorBox('battle-error', describeAIError(err));
      btn.disabled = false;
      btn.textContent = "Submit Answer";
      return;
    }
    btn.disabled = false;
    btn.textContent = "Submit Answer";

    const isCorrect = result.score >= 1;
    logAndResolve({
      question: q.question,
      type: 'short',
      chosen: answer,
      correct: q.ideal_answer || '',
      explanation: (q.explanation || '') + (result.feedback ? ' — ' + result.feedback : ''),
      earned: result.score,
      max: result.max_score
    }, isCorrect);
  });

  function logAndResolve(entry, isCorrect){
    sfx(isCorrect ? 'correct' : 'wrong');
    state.review.push(entry);
    state.totalScore += entry.earned;
    state.totalMax += entry.max;

    let attacker, defender;
    if(state.mode === 'pvp'){
      const buzzedFirst = state.activePvpPlayer;
      const opponent = buzzedFirst === 'p1' ? 'p2' : 'p1';
      attacker = isCorrect ? buzzedFirst : opponent;
      defender = isCorrect ? opponent : buzzedFirst;
    } else {
      attacker = isCorrect ? 'p1' : 'p2';
      defender = isCorrect ? 'p2' : 'p1';
    }

    const dmg = rollDamage();
    const attackerCardId = attacker === 'p1' ? 'card-p1' : 'card-p2';
    const defenderCardId = defender === 'p1' ? 'card-p1' : 'card-p2';
    const isMonsterAttacker = (state.mode === 'pve' && attacker === 'p2');
    const impactDelay = isMonsterAttacker ? 350 : 2000;

    function resolveImpact(){
      dealDamage(defender, dmg);
      const willDie = state[defender].hp <= 0;
      if(willDie){
        const defeatedName = defender === 'p1' ? state.p1.name : state.p2.name;
        toast(defeatedName + " has been defeated!", 1900);
      } else {
        toast(isCorrect ? "Correct! " + dmg + " damage dealt." : "Not quite — " + dmg + " damage taken.", 1800);
      }
      setTimeout(nextStep, 1200);
    }

    if(isMonsterAttacker){
      triggerLunge(document.getElementById(attackerCardId));
      setTimeout(resolveImpact, impactDelay);
    } else {
      fireRocket(attackerCardId, defenderCardId, impactDelay, resolveImpact);
    }
  }

  function nextStep(){
    const battleOver = state.mode === 'pvp'
      ? (state.p1.hp <= 0 || state.p2.hp <= 0)
      : (state.p1.hp <= 0);
    if(battleOver){
      return endBattle();
    }
    state.currentIndex++;
    if(state.currentIndex >= state.questions.length){
      return endBattle();
    }
    renderQuestion();
  }

  /* ===================== Summary ===================== */
  function endBattle(){
    let resultText, resultSub;
    if(state.mode === 'pvp'){
      if(state.p1.hp <= 0 && state.p2.hp <= 0){ resultText = "DRAW"; resultSub = "Both players went down together."; }
      else if(state.p1.hp <= 0){ resultText = "PLAYER 2 WINS"; resultSub = state.p2.name + " came out on top."; }
      else if(state.p2.hp <= 0){ resultText = "PLAYER 1 WINS"; resultSub = state.p1.name + " came out on top."; }
      else if(state.p1.hp === state.p2.hp){ resultText = "DRAW"; resultSub = "Even HP when questions ran out."; }
      else { resultText = state.p1.hp > state.p2.hp ? "PLAYER 1 WINS" : "PLAYER 2 WINS"; resultSub = "Higher HP when questions ran out."; }
    } else {
      if(state.p1.hp <= 0){
        resultText = "DEFEAT";
        resultSub = "The ocean got the better of you this time.";
      } else {
        resultText = "VICTORY";
        const bossCleared = state.bossSpawned && state.currentEnemy && state.currentEnemy.type === 'boss' && state.currentEnemy.hitsRemaining <= 0;
        const bossEscaped = state.bossSpawned && !bossCleared;
        resultSub = bossCleared
          ? "You cleared every minion and took down the boss shark!"
          : bossEscaped
            ? "You survived the gauntlet, but the boss shark got away."
            : "You cleared every creature in your path!";
      }
    }

    const banner = document.getElementById('result-banner');
    banner.textContent = resultText;
    banner.style.color = (resultText === 'VICTORY' || resultText === 'PLAYER 1 WINS') ? '#3FE0A0' : (resultText === 'DRAW' ? 'var(--gold)' : 'var(--coral)');
    document.getElementById('result-sub').textContent = resultSub;
    document.getElementById('result-score').textContent = state.totalScore + ' / ' + state.totalMax;
    const accuracy = state.totalMax > 0 ? Math.round((state.totalScore/state.totalMax)*100) : 0;
    document.getElementById('result-accuracy').textContent = accuracy + '%';

    const reviewList = document.getElementById('review-list');
    reviewList.innerHTML = '';
    state.review.forEach((entry, i)=>{
      const row = document.createElement('div');
      row.className = 'p-3 rounded-xl border';
      row.style.borderColor = 'var(--line)';
      row.style.background = 'rgba(4,18,28,0.4)';
      row.innerHTML = `
        <p class="text-sm font-semibold mb-1">Q${i+1}. ${escapeHtml(entry.question)}</p>
        <p class="text-xs mb-0.5" style="color:var(--foam-dim)">Your answer: <span style="color:var(--foam)">${escapeHtml(entry.chosen)}</span></p>
        ${entry.type === 'mcq' ? `<p class="text-xs mb-0.5" style="color:var(--foam-dim)">Correct answer: <span style="color:#3FE0A0">${escapeHtml(entry.correct)}</span></p>` : ''}
        <p class="text-xs mb-0.5" style="color:var(--foam-dim)">Score: ${entry.earned}/${entry.max}</p>
        <p class="text-xs italic mt-1" style="color:var(--cyan)">${escapeHtml(entry.explanation || '')}</p>
      `;
      reviewList.appendChild(row);
    });

    sfx(resultText === 'DRAW' ? 'draw' : (resultText === 'DEFEAT' ? 'defeat' : 'victory'));
    showScreen('screen-summary');
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  document.getElementById('play-again-btn').addEventListener('click', ()=>{
    showScreen('screen-setup');
  });

})();
</script>
</body>
</html>
