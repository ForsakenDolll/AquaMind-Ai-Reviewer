<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>AquaMind — Dive Into Knowledge</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#061622;
    --abyss-2:#0B2333;
    --panel:#0F2C40;
    --panel-2:#123650;
    --line: rgba(125,211,225,0.18);
    --cyan:#4DE8E0;
    --cyan-dim:#2E8C8A;
    --violet:#8B7CF6;
    --coral:#FF6B6B;
    --gold:#FFC96B;
    --foam:#E7F6F8;
    --foam-dim:#83A9B4;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; padding:0;}
  html{
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #103b52 0%, var(--abyss) 55%, #030c13 100%);
  }
  body{
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #103b52 0%, var(--abyss) 55%, #030c13 100%);
    color: var(--foam);
    font-family:'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
  }
  .font-display{ font-family:'Orbitron', sans-serif; letter-spacing:0.02em; }
  .font-arcade{ font-family:'Press Start 2P', 'Orbitron', sans-serif; line-height:1.7; letter-spacing:0.01em; }
  .neon-cyan{ color:#6CFBF3; text-shadow: 0 0 6px rgba(108,251,243,0.9), 0 0 18px rgba(77,232,224,0.6), 0 0 34px rgba(77,232,224,0.35); }
  .neon-yellow{ color:#FFE68A; text-shadow: 0 0 6px rgba(255,230,138,0.9), 0 0 18px rgba(255,201,107,0.55); }

  /* ---------- Ambient canvas + bubbles ---------- */
  #caustics-canvas{ position:fixed; inset:0; z-index:0; opacity:0.55; pointer-events:none; }
  #bubble-field{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .bubble{
    position:absolute; bottom:-10%;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(200,245,250,0.55), rgba(150,220,230,0.05) 70%);
    border:1px solid rgba(200,245,250,0.15);
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    8%{ opacity:0.8; }
    100%{ transform: translateY(-115vh) translateX(var(--drift, 20px)); opacity:0; }
  }

  #app{ transition: transform .1s; }
  .app-fullscreen{ min-height:100vh; min-height:100dvh; width:100%; }

  /* Battle screen pins directly to the viewport (fixed), completely bypassing
     #app's flex-centering and padding — that combination was compounding two
     different centering calculations and shifting/clipping the scene. */
  .battle-fullscreen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    height:100dvh;
    overflow-y:auto;
    z-index:20;
  }
  .shake-sm{ animation: appShakeSm .3s ease; }
  .shake-md{ animation: appShakeMd .35s ease; }
  .shake-lg{ animation: appShakeLg .45s ease; }
  @keyframes appShakeSm{
    10%,90%{ transform: translate3d(-1px,0,0); }
    30%,50%,70%{ transform: translate3d(-2px,0,0); }
    40%,60%{ transform: translate3d(2px,0,0); }
  }
  @keyframes appShakeMd{
    10%,90%{ transform: translate3d(-1px,0,0); }
    20%,80%{ transform: translate3d(2px,0,0); }
    30%,50%,70%{ transform: translate3d(-5px,0,0); }
    40%,60%{ transform: translate3d(5px,0,0); }
  }
  @keyframes appShakeLg{
    10%,90%{ transform: translate3d(-3px,0,0); }
    20%,80%{ transform: translate3d(5px,0,0); }
    30%,50%,70%{ transform: translate3d(-11px,0,0) rotate(-0.3deg); }
    40%,60%{ transform: translate3d(11px,0,0) rotate(0.3deg); }
  }

  #damage-vignette{
    position:fixed; inset:0; pointer-events:none; z-index:40;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(255,60,60,0.5) 100%);
    opacity:0;
  }

  /* ---------- Panels ---------- */
  .panel{
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2) inset, 0 12px 32px -12px rgba(0,0,0,0.6), 0 0 24px -8px rgba(77,232,224,0.15);
    border-radius: 18px;
  }
  .glow-edge{ box-shadow: 0 0 0 1px rgba(77,232,224,0.35), 0 0 22px -4px rgba(77,232,224,0.45); }
  .question-panel{
    border: 2px solid rgba(77,232,224,0.4);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2) inset, 0 12px 32px -12px rgba(0,0,0,0.6), 0 0 26px -6px rgba(77,232,224,0.4);
  }

  .field-input{
    background: rgba(4,18,28,0.65);
    border:1px solid var(--line);
    color: var(--foam);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    width:100%;
    transition: border-color .2s, box-shadow .2s;
  }
  .field-input:focus{ outline:none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(77,232,224,0.2); }
  .field-input::placeholder{ color: var(--foam-dim); }

  select.field-input{ appearance:none; -webkit-appearance:none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 20 20' fill='none'><path d='M5 7.5L10 12.5L15 7.5' stroke='%2383A9B4' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>"); background-repeat:no-repeat; background-position: right 0.9rem center; padding-right:2.4rem; }

  .label-tag{ color: var(--foam-dim); font-size:0.78rem; font-weight:600; margin-bottom:0.4rem; display:block; }

  .btn-primary{
    background: linear-gradient(180deg, var(--cyan) 0%, var(--cyan-dim) 100%);
    color: #04141c;
    font-family:'Press Start 2P', 'Orbitron', sans-serif;
    font-size:0.8rem;
    border-radius: 14px;
    padding: 1.05rem 1.5rem;
    box-shadow: 0 8px 24px -8px rgba(77,232,224,0.55), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform .15s ease, box-shadow .15s ease;
    touch-action: manipulation;
  }
  .btn-primary:active{ transform: scale(0.97); box-shadow: 0 4px 14px -6px rgba(77,232,224,0.5); }
  .btn-primary:disabled{ opacity:0.4; filter:grayscale(0.4); }

  .btn-ghost{
    background: linear-gradient(180deg, #16394E, #0B2333);
    border:1px solid var(--line);
    color: var(--foam);
    font-family:'Press Start 2P', 'Orbitron', sans-serif;
    font-size:0.68rem;
    border-radius: 14px;
    padding: 0.95rem 1rem;
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
    touch-action: manipulation;
  }
  .btn-ghost:active{ transform: scale(0.97); background: rgba(77,232,224,0.14); }

  .choice-btn{
    background: linear-gradient(180deg, #16354A 0%, #0A1E2B 100%);
    border:2px solid rgba(77,232,224,0.35);
    border-radius:12px;
    padding: 0.6rem 0.85rem;
    font-size:0.9rem;
    text-align:left;
    color: var(--foam);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 4px 12px -6px rgba(0,0,0,0.7), 0 0 10px -3px rgba(77,232,224,0.35);
    transition: border-color .15s, box-shadow .15s, transform .12s;
    touch-action: manipulation;
    width:100%;
  }
  .choice-btn:active{ transform: scale(0.98); }
  @media (hover:hover) and (pointer:fine){
    .choice-btn:not(:disabled):hover{
      border-color: #FFE68A;
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 8px 18px -6px rgba(0,0,0,0.75), 0 0 16px -2px rgba(255,201,107,0.55);
    }
  }
  .choice-btn.is-correct{ border-color: #3FE0A0; background: linear-gradient(180deg,#123B2C,#0A2419); box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 0 16px -2px rgba(63,224,160,0.6); }
  .choice-btn.is-wrong{ border-color: var(--coral); background: linear-gradient(180deg,#3B1616,#240A0A); box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 0 16px -2px rgba(255,107,107,0.6); }
  .choice-btn:disabled{ opacity:0.55; }

  /* ---------- HUD / HP bars ---------- */
  .hud-frame{
    padding: 3px;
    border-radius: 14px;
    background: linear-gradient(135deg, #C9971C 0%, #F5D67B 30%, #8B5A2B 65%, #C9971C 100%);
    box-shadow: 0 6px 14px -6px rgba(0,0,0,0.6);
  }
  .hud-frame .panel{ border-radius: 11px; }
  .hp-track{ background: rgba(4,15,22,0.7); border:1px solid var(--line); border-radius:999px; height:16px; overflow:hidden; position:relative; }
  .hp-fill{ height:100%; border-radius:999px; transition: width 0.5s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden; }
  .hp-fill::after{
    content:''; position:absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    width:40%; animation: hpShimmer 2.2s linear infinite;
  }
  @keyframes hpShimmer{ 0%{ transform: translateX(-120%); } 100%{ transform: translateX(320%); } }
  .hp-fill-player{ background: linear-gradient(90deg, #16C46A, #6CFFA6); box-shadow: 0 0 10px #22ff88, inset 0 0 6px rgba(255,255,255,0.45); }
  .hp-fill-monster{ background: linear-gradient(90deg, #E43B3B, #FF8F8F); box-shadow: 0 0 10px #ff4040, inset 0 0 6px rgba(255,255,255,0.45); }
  .hp-fill.low-hp{ animation: lowHpPulse 0.9s ease-in-out infinite; }
  @keyframes lowHpPulse{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.65) saturate(1.3); } }

  /* ---------- Character cards ---------- */
  .creature-card{ transition: transform .12s; position:relative; }
  .animate-float{ animation: floaty 4.6s ease-in-out infinite; }
  @keyframes floaty{
    0%,100%{ transform: translate(0,0) rotate(-1deg); }
    25%{ transform: translate(9px,-10px) rotate(0.5deg); }
    50%{ transform: translate(-5px,-16px) rotate(1.2deg); }
    75%{ transform: translate(-11px,-6px) rotate(-0.6deg); }
  }
  .animate-hit{ animation: hitshake 0.42s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes hitshake{
    10%,90%{ transform: translate3d(-2px,0,0) rotate(-1deg); }
    20%,80%{ transform: translate3d(4px,0,0) rotate(1deg); }
    30%,50%,70%{ transform: translate3d(-8px,0,0) rotate(-2deg); }
    40%,60%{ transform: translate3d(8px,0,0) rotate(2deg); }
  }
  .flash-red{ animation: flashred 0.42s ease; }
  @keyframes flashred{ 0%{ filter: brightness(1) saturate(1);} 30%{ filter: brightness(1.6) saturate(2) hue-rotate(-20deg);} 100%{ filter: brightness(1) saturate(1);} }

  /* monster takes a hit: bigger recoil + squash, more predator-like than the diver's shake */
  .recoil-hit{ animation: recoilKick 0.5s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes recoilKick{
    0%{ transform: translateX(0) scale(1,1); }
    20%{ transform: translateX(22px) scale(0.9,1.1); }
    45%{ transform: translateX(-12px) scale(1.05,0.95); }
    70%{ transform: translateX(6px) scale(0.98,1.02); }
    100%{ transform: translateX(0) scale(1,1); }
  }
  /* monster lunges at the player before landing a hit */
  .lunge{ animation: lungeForward 0.4s ease-in-out both; }
  @keyframes lungeForward{
    0%{ transform: translateX(0) scale(1); }
    55%{ transform: translateX(-30px) scale(1.06); }
    100%{ transform: translateX(0) scale(1); }
  }
  /* characters swim into the arena at battle start */
  .swim-in-left{ animation: swimInLeft .6s cubic-bezier(.2,.85,.25,1.15) both; }
  .swim-in-right{ animation: swimInRight .6s cubic-bezier(.2,.85,.25,1.15) both; }
  @keyframes swimInLeft{ 0%{ transform: translateX(-130px) scale(0.7); opacity:0; } 100%{ transform: translateX(0) scale(1); opacity:1; } }
  @keyframes swimInRight{ 0%{ transform: translateX(130px) scale(0.7); opacity:0; } 100%{ transform: translateX(0) scale(1); opacity:1; } }

  /* harpoon dart fired between characters */
  .harpoon-dart{
    position:fixed; height:4px; border-radius:3px; z-index:30; pointer-events:none;
    background: linear-gradient(90deg, var(--gold), rgba(255,201,107,0));
    box-shadow: 0 0 10px rgba(255,201,107,0.85);
    transform-origin: left center;
  }

  /* expanding impact ring on every hit */
  .impact-ring{
    position:absolute; left:50%; top:45%; border-radius:50%; border:3px solid;
    transform: translate(-50%,-50%); pointer-events:none; z-index:18;
    animation: ringExpand .55s ease-out forwards;
  }
  @keyframes ringExpand{ 0%{ width:14px; height:14px; opacity:0.85; } 100%{ width:120px; height:120px; opacity:0; } }

  /* ---------- Vector sprites ---------- */
  .tentacle{ transform-box: fill-box; transform-origin: top center; animation: wiggle 2.6s ease-in-out infinite; }
  .t1{ animation-delay: 0s; } .t2{ animation-delay: .22s; } .t3{ animation-delay: .44s; }
  .t4{ animation-delay: .66s; } .t5{ animation-delay: .88s; } .t6{ animation-delay: 1.1s; }
  @keyframes wiggle{ 0%,100%{ transform: rotate(-9deg); } 50%{ transform: rotate(9deg); } }

  .eyes{ transform-box: fill-box; transform-origin: center; animation: blink 4.5s ease-in-out infinite; }
  @keyframes blink{ 0%,90%,100%{ transform: scaleY(1); } 93%{ transform: scaleY(0.12); } }

  .flipper{ transform-box: fill-box; transform-origin: top center; animation: kick .85s ease-in-out infinite alternate; }
  .fl{ animation-delay: 0s; } .fr{ animation-delay: .42s; }
  @keyframes kick{ 0%{ transform: rotate(-10deg); } 100%{ transform: rotate(10deg); } }

  .sprite-glow{ filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)); }

  /* ---------- Pixel-art character sprites ---------- */
  .sprite-frameflip{
    background-repeat:no-repeat;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    width:100%; height:100%;
  }
  .diver-sprite{ background-size:1200% 100%; }
  .shark-sprite{ background-size:600% 100%; }
  .minion-sprite{ background-size:400% 100%; }
  .flip-x{ transform: scaleX(-1); }

  /* boss gets a fiercer tint + glow; minion uses its own distinct small-fry art (see .minion-sprite) */
  .enemy-boss{ filter: saturate(1.25) brightness(1.05) hue-rotate(18deg) drop-shadow(0 0 10px rgba(255,90,60,0.55)); }

  /* death / defeat animation */
  .sprite-death{
    animation: deathSink 1s cubic-bezier(.4,0,.7,1) forwards !important;
  }
  @keyframes deathSink{
    0%{ transform: translateY(0) rotate(0deg); opacity:1; filter: brightness(1); }
    35%{ transform: translateY(6px) rotate(-12deg); opacity:1; filter: brightness(1.3) saturate(0.6); }
    100%{ transform: translateY(80px) rotate(35deg); opacity:0; filter: brightness(0.6) saturate(0.3); }
  }

  /* ---------- Full-bleed battle scene: HUD, characters, and question card
     all layer on top of one continuous ocean background ---------- */
  .aqua-stage-full{
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    width:100%; min-height:100%;
    background: linear-gradient(180deg, #0E3A54 0%, #0A2740 45%, #051524 100%);
    padding: max(1rem, env(safe-area-inset-top, 0px)) clamp(0.75rem, 4vw, 3rem) max(1.25rem, env(safe-area-inset-bottom, 0px));
  }
  .hud-overlay{
    position:relative; z-index:3;
    display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;
    margin-bottom: clamp(1.5rem, 6vh, 3rem);
  }
  .battle-chars-row{
    position:relative; z-index:2;
    flex:1;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 clamp(0.5rem, 4vw, 4rem);
    min-height:140px;
  }
  .question-overlay{
    position:relative; z-index:3;
    display:flex; justify-content:center;
    margin-top: clamp(-2.5rem, -4vh, -1rem);
  }
  .question-overlay .question-panel{ width:100%; max-width:480px; }
  .stage-seafloor{
    position:absolute; left:0; right:0; bottom:0; height:22px;
    background: linear-gradient(180deg, #1C3A2E 0%, #0E1F19 100%);
    box-shadow: 0 -6px 16px -6px rgba(0,0,0,0.5) inset;
  }
  .light-ray{
    position:absolute; top:-15%; width:70px; height:150%;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0));
    filter: blur(6px); opacity:0.45; pointer-events:none;
  }
  .stage-bubble{
    position:absolute; bottom:-8%; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(210,248,252,0.6), rgba(150,220,230,0.05) 70%);
    border:1px solid rgba(210,248,252,0.2);
    animation-name: bubbleRise; animation-timing-function: linear; animation-iteration-count: infinite;
    pointer-events:none;
  }
  @keyframes bubbleRise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.75; }
    100%{ transform: translateY(-210px) translateX(var(--drift, 14px)); opacity:0; }
  }

  /* ---------- Damage numbers + particle bursts (JS-driven) ---------- */
  .dmg-popup{
    position:absolute; left:50%; top:6px; transform: translate(-50%,0);
    font-family:'Orbitron', sans-serif; font-weight:900; font-size:1.35rem;
    pointer-events:none; z-index:20; white-space:nowrap;
    text-shadow: 0 2px 10px rgba(0,0,0,0.65);
    animation: dmgFloat 1s ease-out forwards;
  }
  @keyframes dmgFloat{
    0%{ transform: translate(-50%,0); opacity:0; }
    15%{ opacity:1; }
    100%{ transform: translate(-50%,-58px); opacity:0; }
  }
  .particle{
    position:absolute; width:6px; height:6px; border-radius:50%;
    pointer-events:none; z-index:19; left:50%; top:42%;
    animation: particleBurst .7s cubic-bezier(.25,.8,.3,1) forwards;
  }
  @keyframes particleBurst{
    0%{ transform: translate(-50%,-50%) scale(1); opacity:1; }
    100%{ transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.15); opacity:0; }
  }

  .screen{ display:none; }
  .screen.active{ display:block; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--cyan-dim); border-radius:8px; }

  .toast{
    position:fixed; left:50%; bottom:1.5rem; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border:1px solid var(--cyan); color:var(--foam);
    padding: 0.8rem 1.2rem; border-radius: 12px; font-size:0.9rem; font-weight:600;
    opacity:0; transition: opacity .25s, transform .25s; z-index:50; max-width:90vw; text-align:center;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,0.6);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .buzz-btn{ transition: transform .1s, filter .15s; }
  .buzz-btn:active{ transform: scale(0.95); }
  .buzz-btn.locked{ filter: grayscale(0.6) brightness(0.7); }

  .qtag{
    display:inline-block; font-family:'Press Start 2P', 'Orbitron', sans-serif; font-size:0.6rem;
    color: var(--abyss); background: linear-gradient(180deg,#FFE68A,#FFC96B);
    padding:0.3rem 0.6rem; border-radius:6px; box-shadow: 0 0 10px -1px rgba(255,201,107,0.7);
  }
</style>
</head>
<body>

<canvas id="caustics-canvas"></canvas>
<div id="bubble-field"></div>
<div id="damage-vignette"></div>

<div id="app" class="relative z-10 app-fullscreen px-3 py-4 sm:py-8 flex flex-col items-center">

  <!-- ================= SETUP SCREEN ================= -->
  <section id="screen-setup" class="screen active w-full max-w-xl">
    <header class="text-center mb-7">
      <div class="inline-flex items-center gap-2 mb-3">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2C9 6 5 8 5 13a7 7 0 0 0 14 0c0-5-4-7-7-11Z" stroke="#4DE8E0" stroke-width="1.6"/><path d="M9.5 13.5c0 1.4 1.1 2.5 2.5 2.5" stroke="#8B7CF6" stroke-width="1.6" stroke-linecap="round"/></svg>
        <h1 class="font-arcade neon-cyan" style="font-size:clamp(1.1rem, 5vw, 1.9rem);">AQUAMIND</h1>
      </div>

      <p class="text-sm" style="color:var(--foam-dim);">Dive in. Answer fast. Sink the monster before it sinks you.</p>
    </header>

    <form id="setup-form" class="panel p-5 sm:p-7 space-y-4">
      <div>
        <label class="label-tag" for="f-topic">Topic</label>
        <input id="f-topic" class="field-input" type="text" placeholder="e.g. Ocean Ecosystems, World War II, Fractions…" required value="Ocean Ecosystems">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="label-tag" for="f-difficulty">Difficulty</label>
          <select id="f-difficulty" class="field-input">
            <option>Easy</option>
            <option selected>Medium</option>
            <option>Hard</option>
          </select>
        </div>
        <div>
          <label class="label-tag" for="f-qtype">Question Type</label>
          <select id="f-qtype" class="field-input">
            <option value="mcq">Multiple Choice</option>
            <option value="short">Short Answer</option>
            <option value="mixed" selected>Mixed</option>
          </select>
        </div>
      </div>

      <div>
        <label class="label-tag">Game Mode</label>
        <div class="grid grid-cols-2 gap-3">

<script>
(function(){
  "use strict";

  /* ===================== Canvas caustics (animated background light) ===================== */
  const causticsCanvas = document.getElementById('caustics-canvas');
  const cctx = causticsCanvas.getContext('2d');
  let cw = 0, ch = 0;
  function resizeCaustics(){
    cw = causticsCanvas.width = window.innerWidth;
    ch = causticsCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCaustics);
  resizeCaustics();

  let causticsTime = 0;
  function drawCaustics(){
    causticsTime += 0.012;
    cctx.clearRect(0,0,cw,ch);
    cctx.globalCompositeOperation = 'lighter';
    const bands = 7;
    for(let i=0;i<bands;i++){
      cctx.beginPath();
      const yBase = (ch/bands) * i + (ch/bands)/2;
      const amp = 16 + (i % 3) * 6;
      for(let x=0; x<=cw; x += 24){
        const y = yBase + Math.sin(x*0.012 + causticsTime*1.4 + i*1.3) * amp
                        + Math.sin(x*0.004 - causticsTime*0.6 + i) * (amp*0.6);
        if(x === 0) cctx.moveTo(x,y); else cctx.lineTo(x,y);
      }
      cctx.strokeStyle = 'rgba(77,232,224,' + (0.035 + (i%2)*0.02) + ')';
      cctx.lineWidth = 22;
      cctx.stroke();
    }
    requestAnimationFrame(drawCaustics);
  }
  drawCaustics();

  /* ===================== Ambient bubbles ===================== */
  const bubbleField = document.getElementById('bubble-field');
  function spawnBubbles(n){
    for(let i=0;i<n;i++){
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 6 + Math.random()*22;
      b.style.width = size+'px';
      b.style.height = size+'px';
      b.style.left = Math.random()*100+'vw';
      b.style.setProperty('--drift', (Math.random()*60-30)+'px');
      const dur = 9 + Math.random()*10;
      b.style.animationDuration = dur+'s';
      b.style.animationDelay = (Math.random()*dur)+'s';
      bubbleField.appendChild(b);
    }
  }
  spawnBubbles(22);

  function spawnStageBubbles(n){
    const stage = document.getElementById('aqua-stage');
    if(!stage) return;
    for(let i=0;i<n;i++){
      const b = document.createElement('div');
      b.className = 'stage-bubble';
      const size = 4 + Math.random()*12;
      b.style.width = size+'px';
      b.style.height = size+'px';
      b.style.left = (5 + Math.random()*90)+'%';
      b.style.setProperty('--drift', (Math.random()*40-20)+'px');
      const dur = 5 + Math.random()*6;
      b.style.animationDuration = dur+'s';
      b.style.animationDelay = (Math.random()*dur)+'s';
      stage.appendChild(b);
    }
  }
  spawnStageBubbles(14);

  /* ===================== Toast ===================== */
  let toastTimer = null;
  function toast(msg, ms){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>el.classList.remove('show'), ms || 2200);
  }

  /* ===================== Screen switching ===================== */
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ===================== JS visual FX: damage numbers + particle bursts ===================== */
  function spawnDamageNumber(cardId, text, color){
    const card = document.getElementById(cardId);
    const el = document.createElement('div');
    el.className = 'dmg-popup';
    el.style.color = color;
    el.textContent = text;
    card.appendChild(el);
    setTimeout(()=>el.remove(), 1000);
  }

  function spawnParticles(cardId, color, count){
    const card = document.getElementById(cardId);
    const n = count || 10;
    for(let i=0;i<n;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 26 + Math.random()*46;
      p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
      p.style.background = color;
      p.style.animationDelay = (Math.random()*0.08) + 's';
      card.appendChild(p);
      setTimeout(()=>p.remove(), 780);
    }
  }

  function shakeApp(tier){
    const app = document.getElementById('app');
    app.classList.remove('shake-sm','shake-md','shake-lg');
    void app.offsetWidth;
    if(tier) app.classList.add(tier);
  }

  function pulseVignette(){
    const v = document.getElementById('damage-vignette');
    v.style.transition = 'opacity .05s ease';
    v.style.opacity = '1';
    setTimeout(()=>{
      v.style.transition = 'opacity .55s ease';
      v.style.opacity = '0';
    }, 90);
  }

  function spawnImpactRing(cardId, color){
    const card = document.getElementById(cardId);
    const ring = document.createElement('div');
    ring.className = 'impact-ring';
    ring.style.borderColor = color;
    card.appendChild(ring);
    setTimeout(()=>ring.remove(), 570);
  }

  function fireHarpoon(fromCardId, toCardId){
    const fromEl = document.getElementById(fromCardId);
    const toEl = document.getElementById(toCardId);
    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();
    const startX = fromRect.left + fromRect.width/2;
    const startY = fromRect.top + fromRect.height/2;
    const endX = toRect.left + toRect.width/2;
    const endY = toRect.top + toRect.height/2;
    const dx = endX - startX, dy = endY - startY;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const dist = Math.hypot(dx, dy);

    const dart = document.createElement('div');
    dart.className = 'harpoon-dart';
    dart.style.left = startX + 'px';
    dart.style.top = startY + 'px';
    dart.style.width = dist + 'px';
    dart.style.transform = `rotate(${angle}deg) scaleX(0)`;
    dart.style.transition = 'transform .26s cubic-bezier(.2,.8,.2,1), opacity .2s ease .18s';
    document.body.appendChild(dart);
    requestAnimationFrame(()=>{
      dart.style.transform = `rotate(${angle}deg) scaleX(1)`;
      dart.style.opacity = '0';
    });
    setTimeout(()=>dart.remove(), 320);
  }

  function pauseFloat(cardEl){
    const hadFloat = cardEl.classList.contains('animate-float');
    if(hadFloat) cardEl.classList.remove('animate-float');
    return hadFloat;
  }

  function triggerRecoil(cardEl){
    const hadFloat = pauseFloat(cardEl);
    cardEl.classList.add('recoil-hit');
    setTimeout(()=>{
      cardEl.classList.remove('recoil-hit');
      if(hadFloat) cardEl.classList.add('animate-float');
    }, 520);
  }

  function triggerLunge(cardEl){
    const hadFloat = pauseFloat(cardEl);
    cardEl.classList.add('lunge');
    setTimeout(()=>{
      cardEl.classList.remove('lunge');
      if(hadFloat) cardEl.classList.add('animate-float');
    }, 420);
  }

  function playEntrance(cardEl, fromSide){
    const hadFloat = pauseFloat(cardEl);
    const cls = fromSide === 'left' ? 'swim-in-left' : 'swim-in-right';
    cardEl.classList.add(cls);
    setTimeout(()=>{
      cardEl.classList.remove(cls);
      if(hadFloat) cardEl.classList.add('animate-float');
    }, 650);
  }
